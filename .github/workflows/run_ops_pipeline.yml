name: DGF Ops Pipeline

on:
  # Trigger 1: automatically run AFTER the main pipeline finishes successfully.
  # This guarantees Logistics always reads a FRESH master_orders.parquet.
  workflow_run:
    workflows: ["DGF Pipeline Scheduler"]
    types:
      - completed
  # Trigger 2: manual run button (for testing / re-runs)
  workflow_dispatch:

jobs:
  run-ops-pipeline:
    runs-on: ubuntu-latest
    # Only proceed if: (a) triggered manually, OR
    #                  (b) the main pipeline actually SUCCEEDED
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run Ops Pipeline
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DRIVE_ANALYTICS_FOLDER_ID: ${{ secrets.DRIVE_ANALYTICS_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          python "DGF_Ops_Pipeline.py"
